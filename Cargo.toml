[package]
name = "sinew"
version = "0.1.0"
edition = "2024"
description = "Columnar, SIMD-kernel SQL engine for a SQLite-compatible read subset"

[features]
default = ["sqlite-import"]
# Import a SQLite database file into the sinew format (pulls in C SQLite).
sqlite-import = ["dep:rusqlite"]

[dependencies]
memmap2 = "0.9"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }

[workspace]
members = ["bench"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.bench]
inherits = "release"
